
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Aviation Training Portal</title>

    <!-- React libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
            color: #172b4d;
        }

        header {
            background-color: #12345b;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .course {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #dddddd;
        }

        .course h3 {
            color: #12345b;
        }

        .course a {
            color: #1262a3;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Aviation Training Portal</h1>
        <p>Explore aviation training courses</p>
    </header>

    <main>
        <div id="root"></div>
    </main>

    <script type="text/babel">

        function App() {

            // Store courses and search information
            const [courses, setCourses] = React.useState([]);
            const [search, setSearch] = React.useState("");
            const [category, setCategory] = React.useState("All");
            const [error, setError] = React.useState("");

            // Get courses from WordPress
            React.useEffect(() => {

                fetch("/wp-json/wp/v2/training-courses")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Could not load courses");
                        }
                        return response.json();
                    })
                    .then(data => setCourses(data))
                    .catch(() => setError("Unable to load courses."));

            }, []);

            // Choose a category based on the course title
            function getCategory(title) {
                if (title.includes("Pilot")) return "Pilot Training";
                if (title.includes("Airport")) return "Airport Operations";
                if (title.includes("Safety")) return "Safety";
                if (title.includes("Maintenance")) return "Maintenance";
                return "Other";
            }

            // Filter courses by search and category
            const filteredCourses = courses.filter(course => {

                const title = course.title.rendered;
                const matchesSearch = title.toLowerCase()
                    .includes(search.toLowerCase());

                const matchesCategory = category === "All" ||
                    getCategory(title) === category;

                return matchesSearch && matchesCategory;
            });

            return (
                <div>

                    <h2>Available Courses</h2>

                    <input
                        type="search"
                        placeholder="Search courses"
                        aria-label="Search courses"
                        value={search}
                        onChange={event => setSearch(event.target.value)}
                    />

                    <select
                        aria-label="Filter by category"
                        value={category}
                        onChange={event => setCategory(event.target.value)}
                    >
                        <option value="All">All Categories</option>
                        <option value="Pilot Training">Pilot Training</option>
                        <option value="Airport Operations">Airport Operations</option>
                        <option value="Safety">Safety</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>

                    {error && <p role="alert">{error}</p>}

                    {!error && <p>{filteredCourses.length} courses found</p>}

                    <div className="courses">

                        {filteredCourses.map(course => (

                            <div className="course" key={course.id}>

                                <h3>{course.title.rendered
                                    .replace("&amp;", "&")}</h3>

                                <p>{getCategory(course.title.rendered)}</p>

                                <a href={course.link}>
                                    View Course
                                </a>

                            </div>

                        ))}

                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(
            document.getElementById("root")
        ).render(<App />);

    </script>

</body>
</html>
